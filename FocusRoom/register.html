<h1>Inscription</h1>
<div class="container">
    <form onsubmit="register(event)">
        <input type="text" id="regUser" placeholder="Nom d'utilisateur" required>
        <input type="email" id="regEmail" placeholder="Adresse e-mail" required onchange="verif_mail(this.value)">
        <div id="alert_email" style="color:red; font-size:12px;"></div>
        <input type="date" id="dateNais" placeholder="Date de naissance" required>
        <input type="password" id="regPass" placeholder="Mot de passe" required onchange="verif_mdp(this.value)">
        <div id="alert_mdp" style="color:red; font-size:12px; margin-top:5px;"></div>
        <button type="submit">S'inscrire</button>
    </form>
    <img src="register.jpg" alt="" style="margin-top:20px;"width="500" >
</div>
<script src="script.js"></script>
</body>
</html>
